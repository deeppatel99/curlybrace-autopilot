  auto: true
- topic: Two Users Edited the Same Order. The Second Save Silently Erased the First. rowversion or UPDLOCK?
  track: sql
  format: versus
  notes: It opens with a support agent's address correction quietly overwritten by a warehouse update
    a few seconds later, then pits optimistic concurrency (EF Core rowversion and DbUpdateConcurrencyException)
    against pessimistic locking (UPDLOCK/HOLDLOCK), arguing that optimistic should be the default and
    that locks only belong on short, high-contention hot rows such as inventory counters.
  status: pending
  auto: true
- topic: Our Pipeline Had a Client Secret That Expired Every 12 Months. Workload Identity Federation Deleted
    It.
  track: azure
  format: build-log
  notes: It opens with every deployment failing on the morning a service principal secret quietly expired,
    then walks through moving Azure DevOps and GitHub Actions service connections to OIDC workload identity
    federation, with the trust config, the scoped role assignments and the gotchas; the stance is that
    a long-lived secret in a CI pipeline is now indefensible.
  status: pending
  auto: true
