- topic: The User Closed the Tab. Our API Kept Working for 40 Seconds Anyway.
  track: aspnetcore
  format: bug-hunt
  notes: It opens with connection pool exhaustion during a traffic spike, traced back to abandoned report
    requests that kept running because nobody passed HttpContext.RequestAborted down to EF Core and HttpClient;
    the stance is that a CancellationToken parameter you never pass on is worse than having none at all.
