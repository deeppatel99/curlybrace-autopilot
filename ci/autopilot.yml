name: Curly Brace autopilot

on:
  schedule:
    - cron: "30 3 * * 1"        # every Monday 09:00 IST (03:30 UTC)
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      topic:
        description: "One-off topic (leave empty to take the next one from topics/queue.yaml)"
        required: false
      track:
        description: "Track for a one-off topic (csharp, aspnetcore, design, sql, azure, devops, ai, system-design)"
        required: false
      format:
        description: "Format for a one-off topic"
        required: false
        type: choice
        options: ["", "deep-dive", "bug-hunt", "build-log", "versus", "interview", "news"]
      mode:
        description: "Publish mode override"
        required: false
        type: choice
        options: ["", "api", "import", "local"]

permissions:
  contents: write                # lets the run upload images + update the queue

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60              # research mode verifies facts on the web: three longer Claude calls
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code CLI (for writer.backend claude-code)
        run: npm install -g @anthropic-ai/claude-code

      - name: Write, render, host, publish
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_TRACK: ${{ inputs.track }}
          IN_MODE: ${{ inputs.mode }}
          IN_FORMAT: ${{ inputs.format }}
        run: |
          MODE_FLAG=""
          if [ -n "$IN_MODE" ]; then MODE_FLAG="--mode $IN_MODE"; fi
          FORMAT_FLAG=""
          if [ -n "$IN_FORMAT" ]; then FORMAT_FLAG="--format $IN_FORMAT"; fi
          if [ -n "$IN_TOPIC" ]; then
            python run.py topic "$IN_TOPIC" --track "$IN_TRACK" $FORMAT_FLAG $MODE_FLAG
          else
            python run.py next $MODE_FLAG
          fi

      - name: Save queue progress
        if: success()
        run: |
          git config user.name  "curlybrace-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add topics/queue.yaml topics/published.yaml
          git diff --cached --quiet || git commit -m "queue: mark topic done, refresh published list"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Tell Telegram the run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>Curly Brace autopilot failed</b>
          No article this time. <a href=\"${RUN_URL}\">Open the run</a>, tap the red step, and send me the error."

      - name: Keep the rendered files for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-output
          path: out/
          retention-days: 14
          if-no-files-found: ignore
